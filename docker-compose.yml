services:
  app:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - "./config.yml:/app/config.yml:ro"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully

  migration:
    image: migrate/migrate
    volumes:
      - ./migrations:/migrations
    command:
      - -path=/migrations
      - -database=postgres://root:root@db:5432/go-uptime?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: go-uptime
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d go-uptime"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
